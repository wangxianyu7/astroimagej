# AstroImageJ default (English) message bundle.
# Keys are dotted by module:
#   multiap.*   = Multi-Aperture Photometry dialog
#   apset.*     = Aperture Settings
#   mp.*        = Multi-Plot
#   dp.*        = Data Processor
#   cc.*        = Coordinate Converter
#   error.*     = Common error / warning messages
#   menu.*      = Menu labels (use with care -- ImageJ macros key off these)
#
# To add a translation, copy this file to messages_<lang>_<COUNTRY>.properties
# (e.g. messages_zh_CN.properties) and translate the values.
# Any missing key falls back to this default automatically.

